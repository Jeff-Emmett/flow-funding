# Gitea Actions CI/CD — Static Site (no tests, build + deploy only)
# Copy to: <repo>/.gitea/workflows/ci.yml
# Replace: flow-funding, /opt/websites/flow-funding, https://flowidity.io/

name: CI/CD

on:
  push:
    branches: [main]

env:
  REGISTRY: localhost:3000
  IMAGE: localhost:3000/jeffemmett/flow-funding
  # kaniko runs inside the job container, where localhost:3000 does not
  # resolve to the registry. Same registry, two reachable names:
  # PUSH goes direct on the gitea network (no Traefik upload ceiling),
  # the git CONTEXT needs HTTPS so it uses the public host.
  BUILD_REGISTRY: server:3000
  BUILD_IMAGE: server:3000/jeffemmett/flow-funding
  CONTEXT_HOST: gitea.jeffemmett.com

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # No Docker daemon and no docker client. The build cannot reach a host
      # Docker API because it has nothing to reach one with.
      # Image built by dev-ops/netcup/gitea/ci-kaniko/build.sh.
      image: localhost:3000/jeffemmett/ci-kaniko:debug
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Set image tag
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          mkdir -p /kaniko/.docker
          AUTH=$(printf '%s:%s' "${{ secrets.REGISTRY_USER }}" "${{ secrets.REGISTRY_TOKEN }}" | base64 | tr -d '\n')
          printf '{"auths":{"${{ env.BUILD_REGISTRY }}":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json

          # kaniko clones the context itself, so there is no checkout step and
          # neither job needs git. Plain http://server:3000 fails here with
          # "server gave HTTP response to HTTPS client", so the context uses the
          # same public host as the registry.
          export GIT_USERNAME=token
          export GIT_PASSWORD="${{ github.token }}"

          /kaniko/executor \
            --context=git://${{ env.CONTEXT_HOST }}/${{ github.repository }}.git#refs/heads/${{ github.ref_name }} \
            --dockerfile=Dockerfile \
            --destination=${{ env.BUILD_IMAGE }}:${{ steps.tag.outputs.image_tag }} \
            --destination=${{ env.BUILD_IMAGE }}:latest \
            --insecure-registry=${{ env.BUILD_REGISTRY }} \
            --compressed-caching=false \
            --verbosity=info

  deploy:
    needs: build
    runs-on: ubuntu-latest
    container:
      # alpine, not docker:cli — nothing here talks to a daemon any more. Until
      # the runner-wide container.docker_host is flipped to '-' the socket is
      # still mounted, but no step in this workflow uses it.
      image: alpine:3.21
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Setup tools
        run: apk add --no-cache curl openssl

      - name: Deploy
        run: |
          set -eu
          BODY="{\"tag\":\"${IMAGE_TAG}\"}"
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 \
                  -hmac "${{ secrets.DEPLOY_TAG_SECRET }}" -r | cut -d' ' -f1)
          RESP=$(curl -sS -X POST \
                   -H 'Content-Type: application/json' \
                   -H "X-Deploy-Signature: $SIG" \
                   -d "$BODY" "http://deploy-receiver:9000/deploy-tag/flow-funding")
          echo "$RESP"
          JOB=$(printf '%s' "$RESP" | sed -n 's/.*"job":"\([0-9a-f]*\)".*/\1/p')
          PREV=$(printf '%s' "$RESP" | sed -n 's/.*"previous_tag":"\([0-9a-f]*\)".*/\1/p')
          [ -n "$JOB" ] || { echo "no job id in response — refusing to continue"; exit 1; }

          # The POST only ENQUEUES. Without this wait the next step would race the
          # runner and could pass against the version being replaced.
          i=0
          while :; do
            i=$((i+1))
            S=$(curl -sS "http://deploy-receiver:9000/deploy-status/$JOB" \
                | sed -n 's/.*"status":"\([a-z]*\)".*/\1/p')
            if [ "$S" = "succeeded" ]; then echo "deploy succeeded"; break; fi
            if [ "$S" = "failed" ]; then
              echo "deploy FAILED — rolling back to ${PREV:-<none recorded>}"
              if [ -n "$PREV" ]; then
                RBODY="{\"tag\":\"$PREV\"}"
                RSIG=$(printf '%s' "$RBODY" | openssl dgst -sha256 \
                        -hmac "${{ secrets.DEPLOY_TAG_SECRET }}" -r | cut -d' ' -f1)
                curl -sS -X POST -H 'Content-Type: application/json' \
                     -H "X-Deploy-Signature: $RSIG" -d "$RBODY" \
                     "http://deploy-receiver:9000/deploy-tag/flow-funding"
                echo
              fi
              exit 1
            fi
            if [ "$i" -ge 60 ]; then echo "timed out waiting for deploy"; exit 1; fi
            sleep 5
          done
